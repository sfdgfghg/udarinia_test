<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ударения — тренажёр</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.container {
    width: 100%;
    max-width: 720px;
    background: white;
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
h1 {
    text-align: center;
    margin: 0 0 24px;
    color: #333;
    font-size: 32px;
}
.topline {
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#666;
    font-size:14px;
    margin-bottom:8px;
}
.progress {
    height: 12px;
    background:#e9e9ef;
    border-radius: 99px;
    overflow:hidden;
    margin-bottom:36px;
}
.progress-fill {
    height:100%;
    width:0;
    background:linear-gradient(90deg,#667eea,#764ba2);
    transition:width .25s;
}
.word {
    text-align:center;
    font-size:64px;
    font-weight:700;
    color:#222;
    margin: 20px 0 35px;
    min-height: 82px;
}
.vowel {
    display:inline-block;
    cursor:pointer;
    border-radius:8px;
    padding:0 1px;
    transition:.15s;
}
.vowel:hover {
    background:#eef0ff;
    transform:scale(1.08);
}
.vowel.correct {
    color:#20a05a;
}
.vowel.wrong {
    color:#e53935;
}
.feedback {
    min-height:52px;
    text-align:center;
    font-size:22px;
    font-weight:700;
    margin-bottom:16px;
}
.feedback.correct { color:#20a05a; }
.feedback.wrong { color:#e53935; }
button {
    border:0;
    border-radius:12px;
    padding:15px 20px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}
.next {
    display:block;
    width:100%;
    color:white;
    background:#667eea;
}
.next:hover { background:#5969d8; }
.hidden { display:none !important; }
.finish { text-align:center; }
.finish h2 { color:#333; font-size:30px; }
.finish p { color:#666; line-height:1.5; }
.restart {
    color:white;
    background:#667eea;
    width:100%;
    margin-top:10px;
}
.theme {
    display:block;
    margin:0 auto 18px;
    padding:8px 13px;
    font-size:14px;
    background:#f0f1f8;
    color:#444;
}
body.dark {
    background:linear-gradient(135deg,#171b2e 0%,#241538 100%);
}
body.dark .container {
    background:#1d2230;
}
body.dark h1, body.dark .word, body.dark .finish h2 {
    color:#f4f4f5;
}
body.dark .topline, body.dark .finish p {
    color:#aeb4c2;
}
body.dark .progress { background:#303646; }
body.dark .theme { background:#303646; color:#eee; }
@media (max-width:600px) {
    .container { padding:22px 16px; border-radius:20px; }
    h1 { font-size:27px; }
    .word { font-size:48px; }
}
</style>
</head>
<body>
<div class="container">
    <h1>Тренажёр ударений</h1>
    <button class="theme" id="themeBtn">🌙 Тёмная тема</button>

    <div id="game">
        <div class="topline">
            <span id="stageLabel">Этап 1</span>
            <span id="countLabel">1 / 1</span>
        </div>
        <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

        <div class="word" id="word"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next hidden" id="nextBtn">Следующее слово →</button>
    </div>

    <div class="finish hidden" id="finish">
        <h2>🎉 Все слова пройдены!</h2>
        <p>Ошибочные слова повторяются до тех пор, пока все ударения не будут выбраны правильно.</p>
        <button class="restart" id="restartBtn">Начать заново 🔀</button>
    </div>
</div>

const VOWELS = new Set(["а","е","ё","и","о","у","ы","э","ю","я"]);

let stageWords = [];
let stageErrors = [];
let current = 0;
let stageNumber = 1;
let answered = false;

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function startGame() {
    stageWords = shuffle(WORDS);
    stageErrors = [];
    current = 0;
    stageNumber = 1;
    document.getElementById("game").classList.remove("hidden");
    document.getElementById("finish").classList.add("hidden");
    render();
}

function render() {
    const item = stageWords[current];
    answered = false;

    document.getElementById("stageLabel").textContent = "Этап " + stageNumber;
    document.getElementById("countLabel").textContent =
        (current + 1) + " / " + stageWords.length;
    document.getElementById("progressFill").style.width =
        ((current + 1) / stageWords.length * 100) + "%";

    const feedback = document.getElementById("feedback");
    feedback.textContent = "";
    feedback.className = "feedback";
    document.getElementById("nextBtn").classList.add("hidden");

    const word = document.getElementById("word");
    word.innerHTML = "";

    [...item.display].forEach((ch, index) => {
        const span = document.createElement("span");
        span.textContent = ch;
        if (VOWELS.has(ch.toLowerCase())) {
            span.className = "vowel";
            span.addEventListener("click", () => chooseVowel(index, span));
        }
        word.appendChild(span);
    });
}

function chooseVowel(index, clicked) {
    if (answered) return;
    answered = true;

    document.querySelectorAll(".vowel").forEach(v => {
        v.style.pointerEvents = "none";
    });

    const item = stageWords[current];
    const feedback = document.getElementById("feedback");

    if (index === item.stress) {
        clicked.classList.add("correct");
        feedback.textContent = "✓ Правильно!";
        feedback.className = "feedback correct";
    } else {
        clicked.classList.add("wrong");
        feedback.textContent = "✗ Неверно";
        feedback.className = "feedback wrong";

        if (!stageErrors.some(x => x.id === item.id)) {
            stageErrors.push(item);
        }
    }

    document.getElementById("nextBtn").classList.remove("hidden");
}

function nextWord() {
    if (!answered) return;

    current++;

    if (current < stageWords.length) {
        render();
        return;
    }

    if (stageErrors.length > 0) {
        stageWords = shuffle(stageErrors);
        stageErrors = [];
        current = 0;
        stageNumber++;
        render();
    } else {
        document.getElementById("game").classList.add("hidden");
        document.getElementById("finish").classList.remove("hidden");
    }
}

document.getElementById("nextBtn").addEventListener("click", nextWord);
document.getElementById("restartBtn").addEventListener("click", startGame);

if (localStorage.getItem("udareniya-dark") === "1") {
    document.body.classList.add("dark");
}
document.getElementById("themeBtn").addEventListener("click", () => {
    document.body.classList.toggle("dark");
    localStorage.setItem(
        "udareniya-dark",
        document.body.classList.contains("dark") ? "1" : "0"
    );
});
startGame();
